[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "jieba>=0.42",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6",
    "psycopg[binary]>=3.1",
    "minio>=7.2",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
ragkb-ingest = "ragkb.pipeline.ingest:main"
ragkb-mcp = "ragkb.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要 docker compose 起外部服务",
    "model: 需要下载模型，默认跳过",
]
addopts = "-m 'not model and not integration'"
